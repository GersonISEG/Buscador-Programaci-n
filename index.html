<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Personal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',sans-serif; background:#F0F4FF; min-height:100vh; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .spinner { width:36px; height:36px; border:4px solid #BFDBFE; border-top:4px solid #2563EB; border-radius:50%; animation:spin 0.9s linear infinite; margin:0 auto 14px; }
    input:focus, textarea:focus { border-color:#2563EB !important; outline:none; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect } = React;

  const ADMIN_PASSWORD = "admin123";
  const SHEET_NAMES    = ["PROGRAMACION", "RETEN EXCEDENTE", "OBSERVADOS"];
  const GITHUB_USER    = "GersonISEG";
  const GITHUB_REPO    = "Buscador-Programaci-n";
  const CONFIG_FILE    = "config.json";
  const RAW_URL  = "https://raw.githubusercontent.com/" + GITHUB_USER + "/" + GITHUB_REPO + "/main/" + CONFIG_FILE;
  const API_URL  = "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/contents/" + CONFIG_FILE;

  // btoa seguro para tildes y caracteres especiales
  function toBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  const tkStore = {
    get: () => { try { return localStorage.getItem("gh_token") || ""; } catch { return ""; } },
    set: (v) => { try { localStorage.setItem("gh_token", v); } catch {} }
  };

  function extractId(input) {
    const m = input.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if (m) return m[1];
    if (/^[a-zA-Z0-9-_]{20,}$/.test(input.trim())) return input.trim();
    return null;
  }

  function formatRow(row) {
    return {
      consola:  row[0]  || "-",
      hora:     row[2]  || "-",
      unidad:   row[3]  || "-",
      nombre:   row[4]  || "-",
      dni:      row[5]  || "-",
      telefono: row[6]  || "-",
      motivo:   row[8]  || "-",
      estado:   row[10] || "-",
    };
  }

  function badge(sheet) {
    if (sheet === "RETEN EXCEDENTE") return { bg:"#FEF3C7", color:"#92400E", label:"RETÉN" };
    if (sheet === "OBSERVADOS")      return { bg:"#FEE2E2", color:"#991B1B", label:"OBSERVADO" };
    return { bg:"#DCFCE7", color:"#166534", label:"PROGRAMADO" };
  }

  function App() {
    const [data,        setData]        = useState(null);
    const [sheetId,     setSheetId]     = useState("");
    const [sheetTitle,  setSheetTitle]  = useState("");
    const [dni,         setDni]         = useState("");
    const [results,     setResults]     = useState([]);
    const [loading,     setLoading]     = useState(true);
    const [loadMsg,     setLoadMsg]     = useState("");
    const [globalErr,   setGlobalErr]   = useState("");
    const [sheetErrs,   setSheetErrs]   = useState([]);
    const [lastUpdate,  setLastUpdate]  = useState("");
    const [sinSheet,    setSinSheet]    = useState(false);
    const [showAdmin,   setShowAdmin]   = useState(false);
    const [unlocked,    setUnlocked]    = useState(false);
    const [pwdInput,    setPwdInput]    = useState("");
    const [pwdErr,      setPwdErr]      = useState("");
    const [token,       setToken]       = useState(tkStore.get());
    const [sheetName,   setSheetName]   = useState("");
    const [newUrl,      setNewUrl]      = useState("");
    const [saveStatus,  setSaveStatus]  = useState("");
    const [saveMsg,     setSaveMsg]     = useState("");

    useEffect(() => { initLoad(); }, []);

    async function initLoad() {
      setLoading(true);
      setLoadMsg("Leyendo configuración...");
      setGlobalErr("");
      setSinSheet(false);
      try {
        const res = await fetch(RAW_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error("No se encontró config.json en el repositorio.");
        const json = await res.json();
        if (!json.sheetId || json.sheetId.trim() === "") {
          setSinSheet(true);
          setLoading(false); setLoadMsg("");
          return;
        }
        setSheetId(json.sheetId);
        setSheetTitle(json.sheetName || "");
        await loadSheet(json.sheetId);
      } catch (e) {
        setGlobalErr(e.message);
        setLoading(false); setLoadMsg("");
      }
    }

    async function loadSheet(id) {
      setLoading(true);
      setGlobalErr("");
      setSheetErrs([]);
      const processed = {};
      const errors = [];
      for (const name of SHEET_NAMES) {
        setLoadMsg("Cargando hoja: " + name + "...");
        const url = "https://docs.google.com/spreadsheets/d/" + id + "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(name);
        try {
          const r = await fetch(url);
          if (!r.ok) { errors.push(name + ": Error HTTP " + r.status); continue; }
          const txt = await r.text();
          if (txt.trim().startsWith("<!")) { errors.push(name + ": Sheet no público o hoja inexistente"); continue; }
          processed[name] = Papa.parse(txt, { header:false, skipEmptyLines:true }).data;
        } catch (e) { errors.push(name + ": " + e.message); }
      }
      setSheetErrs(errors);
      if (Object.keys(processed).length === 0) {
        setGlobalErr("No se pudo cargar ninguna hoja. Verifica que el Sheet sea público.");
        setLoading(false); setLoadMsg(""); return;
      }
      setData(processed);
      setLastUpdate(new Date().toLocaleString("es-PE"));
      setDni(""); setResults([]);
      setLoading(false); setLoadMsg("");
    }

    async function handleSave() {
      if (!token.trim()) { setSaveStatus("error"); setSaveMsg("Ingresa tu Token de GitHub."); return; }
      const id = extractId(newUrl.trim());
      if (!id) { setSaveStatus("error"); setSaveMsg("Enlace de Sheet inválido."); return; }
      setSaveStatus("saving"); setSaveMsg("Guardando en GitHub...");
      tkStore.set(token.trim());
      try {
        const headers = {
          Authorization: "Bearer " + token.trim(),
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        };
        // toBase64 maneja tildes y caracteres especiales correctamente
        const jsonStr  = JSON.stringify({ sheetId: id, sheetName: sheetName.trim() });
        const content  = toBase64(jsonStr);
        let sha = null;
        const metaRes = await fetch(API_URL, { headers });
        if (metaRes.ok) { sha = (await metaRes.json()).sha; }
        else if (metaRes.status !== 404) throw new Error("No se pudo acceder al repo. Verifica que el token tenga permiso 'repo'.");
        const body = { message: "Actualizar Sheet del dia", content };
        if (sha) body.sha = sha;
        const put = await fetch(API_URL, { method:"PUT", headers, body: JSON.stringify(body) });
        if (!put.ok) { const e = await put.json(); throw new Error(e.message || "Error al guardar."); }
        setSheetId(id);
        setSheetTitle(sheetName.trim());
        setSinSheet(false);
        setSaveStatus("ok");
        setSaveMsg("✅ Sheet actualizado. Todos verán los datos nuevos.");
        setNewUrl("");
        await loadSheet(id);
      } catch (e) { setSaveStatus("error"); setSaveMsg("❌ " + e.message); }
    }

    function search(val) {
      setDni(val);
      if (!data || !val.trim()) { setResults([]); return; }
      const term = val.trim().toLowerCase();
      const found = [];
      Object.entries(data).forEach(([sheet, rows]) => {
        rows.forEach(row => {
          const matchDni   = String(row[5] || "").toLowerCase().includes(term);
          const matchTorre = String(row[3] || "").toLowerCase().includes(term);
          if (matchDni || matchTorre) found.push({ sheet, row });
        });
      });
      setResults(found);
    }

    function closeAdmin() {
      setShowAdmin(false); setUnlocked(false);
      setPwdInput(""); setPwdErr("");
      setSaveStatus(""); setSaveMsg("");
    }

    /* ── LOADING ── */
    if (loading) return (
      <div style={{fontFamily:"'Segoe UI',sans-serif",background:"#F0F4FF",minHeight:"100vh"}}>
        <div style={{background:"linear-gradient(135deg,#1D4ED8,#3B82F6)",padding:"18px 20px"}}>
          <h1 style={{color:"#fff",fontSize:20,fontWeight:700,margin:0}}>🔍 Control de Personal</h1>
          <p style={{color:"rgba(255,255,255,0.75)",fontSize:12,marginTop:2}}>Búsqueda por DNI</p>
        </div>
        <div style={{textAlign:"center",padding:50}}>
          <div className="spinner"/>
          <p style={{fontWeight:600,color:"#1e293b"}}>{loadMsg || "Cargando..."}</p>
          <p style={{fontSize:12,color:"#94A3B8"}}>Conectando con Google Sheets</p>
        </div>
      </div>
    );

    /* ── MAIN ── */
    return (
      <div style={{fontFamily:"'Segoe UI',sans-serif",background:"#F0F4FF",minHeight:"100vh",color:"#1e293b"}}>

        {/* HEADER */}
        <div style={{background:"linear-gradient(135deg,#1D4ED8,#3B82F6)",padding:"18px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",boxShadow:"0 4px 12px rgba(37,99,235,0.4)"}}>
          <div>
            <h1 style={{color:"#fff",fontSize:20,fontWeight:700,margin:0}}>🔍 Control de Personal</h1>
            <p style={{color:"rgba(255,255,255,0.75)",fontSize:12,marginTop:2}}>Búsqueda por DNI</p>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={initLoad} title="Actualizar"
              style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:8,color:"#fff",fontSize:20,width:40,height:40,cursor:"pointer"}}>
              🔄
            </button>
            <button onClick={() => { setShowAdmin(!showAdmin); if(showAdmin) closeAdmin(); }}
              style={{background:"rgba(255,255,255,0.2)",border:"none",borderRadius:8,color:"#fff",fontSize:20,width:40,height:40,cursor:"pointer"}}>
              ⚙️
            </button>
          </div>
        </div>

        <div style={{padding:16}}>

          {/* ERROR GLOBAL */}
          {globalErr && !showAdmin && (
            <div style={{background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:10,padding:"12px 14px",marginBottom:12,color:"#DC2626",fontSize:13}}>
              ⚠️ {globalErr}
            </div>
          )}

          {/* PANEL ADMIN */}
          {showAdmin && (
            <div style={{background:"#EFF6FF",borderRadius:14,padding:16,marginBottom:14,border:"1px solid #BFDBFE"}}>
              <p style={{fontSize:16,fontWeight:700,color:"#1D4ED8",marginBottom:12}}>⚙️ Panel Administrativo</p>

              <p style={{fontSize:13,fontWeight:600,color:"#1D4ED8",marginBottom:4}}>Sheet activo</p>
              <div style={{padding:"10px 12px",background:"#fff",border:"1.5px solid #BFDBFE",borderRadius:8,fontSize:13,color:sheetId?"#1e293b":"#94A3B8",marginBottom:14,wordBreak:"break-all"}}>
                {sheetId ? "ID: ..." + sheetId.slice(-20) : "Sin configuración aún"}
              </div>

              {!unlocked ? (
                <>
                  <p style={{fontSize:13,fontWeight:600,color:"#1D4ED8",marginBottom:4}}>Contraseña Admin</p>
                  <input type="password" placeholder="Contraseña" value={pwdInput}
                    onChange={e=>{setPwdInput(e.target.value);setPwdErr("");}}
                    onKeyDown={e=>{if(e.key==="Enter"){if(pwdInput===ADMIN_PASSWORD){setUnlocked(true);setPwdInput("");}else{setPwdErr("Contraseña incorrecta");setPwdInput("");}}}}
                    style={{width:"100%",padding:"10px 12px",fontSize:14,border:"1.5px solid #BFDBFE",borderRadius:8,marginBottom:10}}/>
                  {pwdErr && <div style={{background:"#FEF2F2",border:"1px solid #FCA5A5",borderRadius:8,padding:"10px 12px",color:"#DC2626",fontSize:13,marginBottom:10}}>⚠️ {pwdErr}</div>}
                  <button onClick={()=>{if(pwdInput===ADMIN_PASSWORD){setUnlocked(true);setPwdInput("");}else{setPwdErr("Contraseña incorrecta");setPwdInput("");}}}
                    style={{background:"#2563EB",color:"#fff",border:"none",borderRadius:10,padding:"12px 20px",fontSize:14,fontWeight:600,cursor:"pointer",width:"100%"}}>
                    Ingresar
                  </button>
                </>
              ) : (
                <>
                  <p style={{fontSize:13,fontWeight:600,color:"#1D4ED8",marginBottom:4}}>
                    🔑 Token de GitHub <span style={{fontWeight:400,color:"#64748B"}}>(guardado solo en este dispositivo)</span>
                  </p>
                  <input type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" value={token}
                    onChange={e=>{setToken(e.target.value);setSaveStatus("");setSaveMsg("");}}
                    style={{width:"100%",padding:"10px 12px",fontSize:13,border:"1.5px solid #BFDBFE",borderRadius:8,marginBottom:14}}/>

                  <p style={{fontSize:13,fontWeight:600,color:"#1D4ED8",marginBottom:4}}>🏷️ Nombre del Sheet (ej: Programación 31-05-2026)</p>
                  <input type="text" placeholder="Ej: Programación 31-05-2026" value={sheetName}
                    onChange={e=>{setSheetName(e.target.value);setSaveStatus("");setSaveMsg("");}}
                    style={{width:"100%",padding:"10px 12px",fontSize:13,border:"1.5px solid #BFDBFE",borderRadius:8,marginBottom:14}}/>

                  <p style={{fontSize:13,fontWeight:600,color:"#1D4ED8",marginBottom:4}}>📋 Enlace del Sheet de hoy</p>
                  <div style={{background:"#DBEAFE",borderRadius:8,padding:"8px 12px",marginBottom:10,fontSize:12,color:"#1D4ED8"}}>
                    ℹ️ El Sheet debe estar en modo <strong>"Cualquier persona con el enlace puede ver"</strong>
                  </div>
                  <textarea placeholder="https://docs.google.com/spreadsheets/d/..." value={newUrl}
                    onChange={e=>{setNewUrl(e.target.value);setSaveStatus("");setSaveMsg("");}}
                    style={{width:"100%",padding:"10px 12px",fontSize:13,border:"1.5px solid #BFDBFE",borderRadius:8,marginBottom:10,minHeight:72,resize:"vertical"}}/>

                  {saveMsg && (
                    <div style={{background:saveStatus==="ok"?"#F0FDF4":saveStatus==="error"?"#FEF2F2":"#EFF6FF",border:"1px solid "+(saveStatus==="ok"?"#86EFAC":saveStatus==="error"?"#FCA5A5":"#BFDBFE"),borderRadius:8,padding:"10px 12px",color:saveStatus==="ok"?"#166534":saveStatus==="error"?"#DC2626":"#1D4ED8",fontSize:13,marginBottom:10}}>
                      {saveMsg}
                    </div>
                  )}
                  <button onClick={handleSave} disabled={saveStatus==="saving"}
                    style={{background:saveStatus==="saving"?"#93C5FD":"#2563EB",color:"#fff",border:"none",borderRadius:10,padding:"12px 20px",fontSize:14,fontWeight:600,cursor:saveStatus==="saving"?"not-allowed":"pointer",width:"100%"}}>
                    {saveStatus==="saving" ? "⏳ Guardando..." : "🚀 Actualizar Sheet para todos"}
                  </button>
                </>
              )}

              <button onClick={closeAdmin}
                style={{background:"#E2E8F0",color:"#475569",border:"none",borderRadius:10,padding:"11px 20px",fontSize:14,cursor:"pointer",width:"100%",marginTop:8}}>
                Cerrar Panel
              </button>
            </div>
          )}

          {/* SIN SHEET CONFIGURADO */}
          {sinSheet && !showAdmin && (
            <div style={{background:"#fff",borderRadius:14,padding:32,textAlign:"center",boxShadow:"0 2px 12px rgba(0,0,0,0.06)"}}>
              <div style={{fontSize:48,marginBottom:12}}>⏳</div>
              <p style={{fontWeight:700,fontSize:16}}>Aún no hay programación cargada</p>
              <p style={{color:"#64748B",fontSize:14,marginTop:8}}>El administrador aún no ha cargado el Sheet del día.</p>
              <p style={{color:"#64748B",fontSize:14,marginTop:4}}>Presiona 🔄 para verificar si ya está disponible.</p>
            </div>
          )}

          {/* BUSCADOR */}
          {data && !showAdmin && (
            <>
              <div style={{background:"#fff",borderRadius:14,padding:16,boxShadow:"0 2px 12px rgba(0,0,0,0.06)",marginBottom:14}}>
                <div style={{position:"relative"}}>
                  <input type="text" inputMode="text" placeholder="Buscar por DNI o Torre..."
                    value={dni} onChange={e=>search(e.target.value)}
                    style={{width:"100%",padding:"14px 44px 14px 16px",fontSize:17,border:"2px solid #BFDBFE",borderRadius:10,background:"#F8FAFF",color:"#1e293b"}}/>
                  {dni && (
                    <button onClick={()=>{setDni("");setResults([]);}}
                      style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"#E2E8F0",border:"none",borderRadius:"50%",width:26,height:26,cursor:"pointer",fontSize:13,color:"#64748B"}}>
                      ✕
                    </button>
                  )}
                </div>
                <div style={{fontSize:12,color:"#64748B",marginTop:8,padding:"8px 12px",background:"#F0F9FF",borderRadius:8,borderLeft:"3px solid #3B82F6"}}>
                  ℹ️ Puedes buscar por <strong>DNI</strong> o por <strong>Torre</strong>. Si el DNI empieza con 0, omítelo.
                </div>
                {lastUpdate && <div style={{fontSize:11,color:"#94A3B8",textAlign:"right",marginTop:6}}>Última carga: {lastUpdate}</div>}
                {sheetErrs.length > 0 && (
                  <div style={{background:"#FFFBEB",borderRadius:8,padding:"8px 12px",marginTop:8,color:"#92400E",fontSize:12}}>
                    {sheetErrs.map((e,i)=><div key={i}>⚠️ {e}</div>)}
                  </div>
                )}
              </div>

              {/* ARCHIVO CARGADO */}
              <div style={{background:"#F0FDF4",borderRadius:10,padding:"10px 14px",marginBottom:14,border:"1px solid #86EFAC",display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:20}}>📄</span>
                <div>
                  <span style={{fontSize:10,color:"#94A3B8",display:"block"}}>Archivo cargado</span>
                  <span style={{fontSize:14,fontWeight:700,color:"#166534"}}>
                    {sheetTitle || "Sin nombre — el admin puede agregar el nombre al cargar el Sheet"}
                  </span>
                </div>
              </div>

              {/* RESULTADOS */}
              {dni && (
                results.length > 0 ? (
                  <>
                    <div style={{background:"#EFF6FF",color:"#1D4ED8",borderRadius:20,padding:"4px 12px",fontSize:13,fontWeight:600,display:"inline-block",marginBottom:12}}>
                      {results.length} resultado{results.length!==1?"s":""} encontrado{results.length!==1?"s":""}
                    </div>
                    {results.map((r,i)=>{
                      const f = formatRow(r.row);
                      const b = badge(r.sheet);
                      return (
                        <div key={i} style={{background:"#fff",borderRadius:12,padding:14,boxShadow:"0 2px 8px rgba(0,0,0,0.07)",marginBottom:12,borderLeft:"4px solid "+b.color}}>
                          <span style={{display:"inline-block",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,background:b.bg,color:b.color,marginBottom:8}}>
                            {b.label}
                          </span>
                          <div style={{fontSize:17,fontWeight:700,marginBottom:6}}>{f.nombre}</div>
                          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"6px 12px"}}>
                            {[["DNI",f.dni],["Teléfono",f.telefono],["Unidad",f.unidad],["Consola",f.consola],["Hora",f.hora],["Motivo",f.motivo]].map(([lbl,val])=>(
                              <div key={lbl} style={{fontSize:13}}>
                                <span style={{color:"#94A3B8",fontSize:11,display:"block"}}>{lbl}</span>
                                {val}
                              </div>
                            ))}
                          </div>
                          {f.estado && f.estado !== "-" && (
                            <div style={{marginTop:8,padding:"8px 10px",background:"#EFF6FF",borderRadius:8,borderLeft:"3px solid #2563EB"}}>
                              <span style={{color:"#94A3B8",fontSize:11,display:"block"}}>Estado</span>
                              <span style={{fontSize:13,fontWeight:600,color:"#1D4ED8"}}>{f.estado}</span>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </>
                ) : (
                  <div style={{textAlign:"center",padding:30,color:"#94A3B8"}}>
                    <div style={{fontSize:40,marginBottom:10}}>🔎</div>
                    <p style={{fontWeight:600}}>DNI no encontrado</p>
                    <p style={{fontSize:13,marginTop:4}}>Verifica el número e intenta de nuevo</p>
                  </div>
                )
              )}
            </>
          )}

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
